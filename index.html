<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STM32 Timer Down-Counter Animation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e2e;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        h2 { margin-bottom: 20px; color: #89b4fa; }

        .diagram-container {
            display: flex;
            align-items: center;
            gap: 15px;
            background-color: #313244;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            position: relative;
        }

        .block {
            border: 2px solid #89b4fa;
            border-radius: 8px;
            padding: 15px 20px;
            text-align: center;
            background-color: #181825;
            min-width: 130px;
            position: relative;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .block h4 { margin: 0 0 8px 0; color: #f5e0dc; font-size: 14px; }
        .block p { margin: 0; font-weight: bold; font-size: 16px; color: #a6e3a1; }

        .arrow {
            font-size: 24px;
            color: #89b4fa;
            user-select: none;
        }

        /* Pulse Animation Class */
        .pulsing {
            border-color: #f9e2af !important;
            box-shadow: 0 0 15px #f9e2af;
        }

        /* START block style */
        .start-btn {
            background-color: #a6e3a1;
            color: #11111b;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .start-btn:hover { background-color: #94e2d5; }
        .start-btn:active { transform: scale(0.95); }
        .start-btn:disabled { background-color: #585b70; cursor: not-allowed; }

        /* Counter Register Display */
        #cnt-value {
            font-size: 28px;
            color: #fab387;
            font-family: 'Courier New', Courier, monospace;
        }

        /* Interrupt Flag Display */
        .flag-active {
            border-color: #f38ba8 !important;
            background-color: #45475a !important;
            box-shadow: 0 0 20px #f38ba8;
        }

        .flag-active p { color: #f38ba8 !important; animation: blink 0.5s infinite alternate; }

        @keyframes blink {
            from { opacity: 1; }
            to { opacity: 0.3; }
        }

        .controls { margin-top: 25px; }
    </style>
</head>
<body>

    <h2>STM32 Timer Down-Counter Diagram</h2>

    <div class="diagram-container">
        
        <!-- System Clock -->
        <div class="block" id="sys-clock">
            <h4>System Clock</h4>
            <p>10 Hz</p>
        </div>

        <div class="arrow">&rarr;</div>

        <!-- Prescaler -->
        <div class="block" id="prescaler">
            <h4>Prescaler</h4>
            <p>Divide by 10</p>
            <span style="font-size: 11px; color: #cdd6f4;">Out: 1 Hz</span>
        </div>

        <div class="arrow">&rarr;</div>

        <!-- Timer / Counter Register -->
        <div class="block" id="counter-block">
            <h4>TIMx_CNT</h4>
            <p id="cnt-value">9</p>
        </div>

        <div class="arrow">&rarr;</div>

        <!-- Update Interrupt Flag -->
        <div class="block" id="flag-block">
            <h4>Update Flag (UIF)</h4>
            <p id="flag-value">0</p>
        </div>

    </div>

    <div class="controls">
        <button class="start-btn" id="btn-start" onclick="startTimer()">START</button>
        <button class="start-btn" style="background-color: #f38ba8; margin-left: 10px;" onclick="resetTimer()">RESET</button>
    </div>

    <script>
        let counter = 9;
        let isRunning = false;
        let intervalId = null;

        function startTimer() {
            if (isRunning) return;
            isRunning = true;
            document.getElementById('btn-start').disabled = true;

            // Timer clock rate is 1 Hz (1000 ms)
            intervalId = setInterval(() => {
                let cntElem = document.getElementById('cnt-value');
                let cntBlock = document.getElementById('counter-block');
                
                // Visual clock pulse on the counter block
                cntBlock.classList.add('pulsing');
                setTimeout(() => cntBlock.classList.remove('pulsing'), 300);

                if (counter > 0) {
                    counter--;
                    cntElem.innerText = counter;
                } else if (counter === 0) {
                    // One more clock pulse causes underflow/update event
                    document.getElementById('flag-value').innerText = '1';
                    document.getElementById('flag-block').classList.add('flag-active');
                    counter = -1;
                    // Play audio beep
                    
                    cntElem.innerText = '9';
                    
                    clearInterval(intervalId);
                    

                }
            }, 1000); // 1 Hz clock rate
            playBeep();
        }

        function resetTimer() {
            clearInterval(intervalId);
            counter = 9;
            isRunning = false;
            document.getElementById('cnt-value').innerText = '9';
            document.getElementById('flag-value').innerText = '0';
            document.getElementById('flag-block').classList.remove('flag-active');
            document.getElementById('btn-start').disabled = false;
        }

        function playBeep() {
            // Standard Web Audio API synthesize beep sound
            let ctx = new (window.AudioContext || window.webkitAudioContext)();
            let osc = ctx.createOscillator();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, ctx.currentTime); // 880 Hz tone
            osc.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.5); // 0.5 seconds duration
        }
    </script>
</body>
</html>
